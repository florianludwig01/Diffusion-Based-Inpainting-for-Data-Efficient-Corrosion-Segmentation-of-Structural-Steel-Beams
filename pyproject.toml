[project]
authors = [{name = "florian.ludwig", email = "florian.ludwig@rwth-aachen.de"}]
name = "evaluation_dataset"
requires-python = ">= 3.9"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
evaluation_dataset = { path = ".", editable = true }
[tool.pixi.tasks]
merge-labels = "python src/04_evaluation_dataset/utils/merge_YOLO_boxes.py"

[tool.pixi.dependencies]
python = "3.10.*"
pip = ">=26.0.1,<27"
pytorch = ">=2.10.0,<3"
torchvision = ">=0.26.0,<0.27"
torchaudio = ">=2.10.0,<3"
pytorch-lightning = ">=2.6.1,<3"
ultralytics = ">=8.4.39,<9"
tensorboard = ">=2.20.0,<3"
setuptools = "<82"
