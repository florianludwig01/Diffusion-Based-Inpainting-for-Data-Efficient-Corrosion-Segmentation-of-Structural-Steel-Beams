[project]
authors = [{name = "florian.ludwig", email = "florian.ludwig@rwth-aachen.de"}]
dependencies = ["anomalib>=2.3.2,<3"]
name = "04_Evaluation_Dataset"
requires-python = ">= 3.9"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
04_evaluation_dataset = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.10.*"
pip = ">=26.0.1,<27"
pytorch = ">=2.10.0,<3"
torchvision = ">=0.26.0,<0.27"
torchaudio = ">=2.10.0,<3"
pytorch-lightning = ">=2.6.1,<3"
